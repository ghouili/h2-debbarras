name: Deploy H2 Débarras (Production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      # Variables (Environment -> deploy -> Variables)
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
      PM2_APP: ${{ vars.PM2_APP || 'debarras' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      NVM_DIR: ${{ vars.NVM_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use pinned known_hosts if provided, otherwise scan
          if [[ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          scp -P "$SSH_PORT" deploy.sh "$SSH_USERNAME@$SSH_HOST:/tmp/deploy.sh"

      - name: Create env file on server
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM || secrets.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO || secrets.SMTP_TO }}
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          # NEXT_PUBLIC_* is inlined at build time, so it must be in .env BEFORE `npm run build` runs on the server.
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID || secrets.NEXT_PUBLIC_GTM_ID }}

        run: |
          ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "cat > /tmp/debarras.env <<'EOF'
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          SMTP_FROM=${SMTP_FROM}
          SMTP_TO=${SMTP_TO}
          API_URL=${API_URL}
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}
          EOF"

      - name: Execute remote deployment
        run: |
          ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "\
            export APP_DIR='${DEPLOY_PATH}' && \
            export REPO_URL='git@github.com:${{ github.repository }}.git' && \
            export BRANCH='production' && \
            export NVM_DIR='${{ vars.NVM_DIR }}' && \
            export PM2_APP='${PM2_APP}' && \
            export APP_PORT='${APP_PORT}' && \
            export ENV_PAYLOAD_PATH='/tmp/debarras.env' && \
            bash /tmp/deploy.sh \
          "
